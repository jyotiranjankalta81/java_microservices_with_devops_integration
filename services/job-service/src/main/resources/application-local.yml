# Local developer profile — localhost defaults, verbose logging, Swagger enabled
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    com.jobintel: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO

springdoc:
  swagger-ui:
    enabled: true

job:
  outbox:
    poll-interval-ms: 2000
