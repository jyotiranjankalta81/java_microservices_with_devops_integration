spring:
  datasource:
    url: ${AUDIT_DB_URL}
    username: ${AUDIT_DB_USER}
    password: ${AUDIT_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

logging:
  level:
    root: WARN
    com.jobintel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
