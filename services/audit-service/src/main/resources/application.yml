spring:
  application:
    name: audit-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_db}
    username: ${AUDIT_DB_USER:audit_user}
    password: ${AUDIT_DB_PASSWORD:audit_pass}
    hikari:
      pool-name: AuditServicePool
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

logging:
  level:
    root: INFO
    com.jobintel: DEBUG
    org.hibernate.SQL: DEBUG
    com.zaxxer.hikari: DEBUG
  pattern:
    console: "%d{ISO8601} %-5level [%thread] service=audit-service traceId=%X{traceId} correlationId=%X{correlationId} userId=%X{userId} - %msg%n"
