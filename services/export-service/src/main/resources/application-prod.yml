spring:
  datasource:
    url: ${EXPORT_DB_URL}
    username: ${EXPORT_DB_USER}
    password: ${EXPORT_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

job:
  service:
    url: ${JOB_SERVICE_URL}

export:
  storage:
    path: ${EXPORT_STORAGE_PATH}

logging:
  level:
    root: WARN
    com.jobintel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
