spring:
  application:
    name: export-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${EXPORT_DB_URL:jdbc:postgresql://localhost:5432/export_db}
    username: ${EXPORT_DB_USER:export_user}
    password: ${EXPORT_DB_PASSWORD:export_pass}
    hikari:
      pool-name: ExportServicePool
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: export-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

job:
  service:
    url: ${JOB_SERVICE_URL:http://localhost:8082}

export:
  storage:
    path: ${EXPORT_STORAGE_PATH:/tmp/exports}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

logging:
  level:
    root: INFO
    com.jobintel: DEBUG
    org.hibernate.SQL: DEBUG
    com.zaxxer.hikari: DEBUG
  pattern:
    console: "%d{ISO8601} %-5level [%thread] service=export-service traceId=%X{traceId} correlationId=%X{correlationId} userId=%X{userId} - %msg%n"
