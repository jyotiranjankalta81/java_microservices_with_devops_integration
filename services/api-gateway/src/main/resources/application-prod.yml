jwt:
  secret: ${JWT_SECRET}

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: job-service
          uri: ${JOB_SERVICE_URL}
          predicates:
            - Path=/api/jobs/**
        - id: dashboard-service
          uri: ${DASHBOARD_SERVICE_URL}
          predicates:
            - Path=/api/dashboard/**
        - id: export-service
          uri: ${EXPORT_SERVICE_URL}
          predicates:
            - Path=/api/export/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL}
          predicates:
            - Path=/api/audit/**

logging:
  level:
    root: WARN
    com.jobintel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

resilience4j:
  circuitbreaker:
    instances:
      jobService:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
