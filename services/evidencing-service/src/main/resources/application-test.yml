spring:
  datasource:
    url: jdbc:h2:mem:evidencing_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: change-me-in-production-use-256-bit-secret-key-minimum!!

aws:
  region: us-east-1
  s3:
    bucket: test-bucket
    local-storage-path: ./target/test-storage
  sqs:
    simulate-local-workers: true

logging:
  level:
    root: WARN
    com.jobintel.evidencing: INFO
